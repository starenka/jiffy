name: Release

# Push a tag like v1.2.3 to build a signed APK and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '/^## \[/{p = (index($0, "## [" v "]") == 1)} p' CHANGELOG.md | tail -n +2 > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "No CHANGELOG.md entry for ${TAG#v}"; exit 1; }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JIFFY_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "JIFFY_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jiffy.jks"
      - name: Test and build signed release APK
        env:
          JIFFY_KEYSTORE: ${{ runner.temp }}/jiffy.jks
          JIFFY_KEYSTORE_PASSWORD: ${{ secrets.JIFFY_KEYSTORE_PASSWORD }}
          JIFFY_KEY_ALIAS: ${{ secrets.JIFFY_KEY_ALIAS }}
          JIFFY_KEY_PASSWORD: ${{ secrets.JIFFY_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          v=${TAG#v}; IFS=. read -r major minor patch <<< "${v%%-*}"
          export VERSION_NAME="$v" VERSION_CODE=$(( major * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          ./gradlew testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "jiffy-$TAG.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "jiffy-$TAG.apk" --notes-file "$RUNNER_TEMP/notes.md" --title "$TAG"
